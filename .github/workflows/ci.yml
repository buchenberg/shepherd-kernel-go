name: ci

on:
  push:
    branches: [main]
    tags: ['v*', 'sandbox/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # A modern toolchain is required for the race detector on current macOS
      # runners: race binaries built by Go 1.21 abort with "missing LC_UUID".
      # The module's declared go 1.21 remains the compatibility floor.
      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt (must be empty)
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 -race ./...
        env:
          CGO_ENABLED: '1'

      - name: build
        run: go build -trimpath ./...

  containerd:
    name: containerd adapter (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox/containerd
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sandbox/containerd/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            sandbox/containerd/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

  golden-drift:
    name: golden drift (vs pinned Python reference)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # The pinned-hash test in golden_provenance_test.go catches edits to OUR
      # copy; this job catches the OTHER side moving -- the Python reference
      # regenerating the shared golden without this repo tracking it. The pin is
      # the same commit the vendored vector files record in their provenance
      # (shepherd2@d34d5ca3); update it together with a deliberate vector
      # regeneration.
      - name: clone the pinned Python reference
        run: |
          git clone --quiet https://github.com/shepherd-agents/shepherd /tmp/shepherd
          git -C /tmp/shepherd checkout --quiet d34d5ca334871dfcb5a3dc76dd78045829fa4e56

      # Hashed in LF form so the result does not depend on either checkout's
      # line-ending configuration -- the same normalization the pinned-hash
      # test applies.
      - name: compare the shared golden file
        run: |
          ours=$(tr -d '\r' < testdata/kernel_abi_v0.json | sha256sum | cut -d' ' -f1)
          theirs=$(tr -d '\r' < /tmp/shepherd/shepherd2/tests/golden/kernel_abi_v0.json | sha256sum | cut -d' ' -f1)
          echo "ours:   $ours"
          echo "theirs: $theirs"
          if [ "$ours" != "$theirs" ]; then
            echo "::error::testdata/kernel_abi_v0.json differs from the reference copy at shepherd2@d34d5ca3. If the reference moved on purpose, reconcile the golden in the same commit and update the pinned hash in golden_provenance_test.go."
            exit 1
          fi

  release-verify:
    name: release verify (tagged module)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/sandbox/')
    steps:
      - name: checkout the tag
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # A tagged module must be consumable from the module proxy's point of
      # view: no replace directives (the nested adapter's old ../.. replace
      # made the published v0.1.0 unbuildable), and every module in the tag
      # must resolve and build from a clean consumer with no local state.
      - name: no replace directives in tagged modules
        run: |
          fail=0
          for mod in go.mod sandbox/containerd/go.mod; do
            if grep -nE '^\s*replace\s' "$mod"; then
              echo "::error::$mod in tag ${GITHUB_REF_NAME} contains a replace directive -- the published module would be unbuildable"
              fail=1
            fi
          done
          exit $fail

      - name: core module resolves and builds from a clean consumer
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${tag#sandbox/}" != "$tag" ]; then
            # A nested-module tag: verify the core requirement it pins too.
            core=$(grep -m1 'github.com/buchenberg/shepherd-kernel-go v' sandbox/containerd/go.mod | awk '{print $2}')
            echo "nested tag $tag -> verifying core $core as well"
            ( cd "$(mktemp -d)" && go mod init verify >/dev/null && \
              go get "github.com/buchenberg/shepherd-kernel-go@${core}" && \
              go get "github.com/buchenberg/shepherd-kernel-go/sandbox/containerd@${tag}" )
          else
            ( cd "$(mktemp -d)" && go mod init verify >/dev/null && \
              go get "github.com/buchenberg/shepherd-kernel-go@${tag}" )
          fi
          echo "tag ${GITHUB_REF_NAME} resolves end-to-end from a clean module context"
