name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (must be empty)
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt found unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 -race ./...
        env:
          CGO_ENABLED: '1'

      - name: build
        run: go build -trimpath ./...

  containerd:
    name: containerd adapter (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox/containerd
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sandbox/containerd/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            sandbox/containerd/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...
